<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор калорий</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fbfaf7);
  --fg:var(--tg-theme-text-color,#1f2a24);
  --hint:var(--tg-theme-hint-color,#7a847d);
  --card:var(--tg-theme-secondary-bg-color,#eef2ec);
  --accent:var(--tg-theme-button-color,#2f7d5b);
  --accent-fg:var(--tg-theme-button-text-color,#fff);
  --danger:#c0473a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 16px 120px}
h1{font-size:20px;margin:0 0 14px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid transparent;background:var(--bg)}
input:focus,select:focus{outline:2px solid var(--accent)}
.row{display:flex;gap:8px;margin-top:8px}
.row>*{flex:1;min-width:0}
.row .narrow{flex:0 0 84px}
button{border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--hint);padding:6px 10px;font-weight:400}
#sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#sug button{background:var(--bg);color:var(--fg);font-weight:400;padding:6px 10px;font-size:14px}
.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--hint) 25%,transparent)}
.item:last-child{border-bottom:0}
.item .n{flex:1}
.item .a{color:var(--hint);font-size:14px}
.item .k{font-variant-numeric:tabular-nums;font-weight:600}
.empty{color:var(--hint);text-align:center;padding:14px 0}
#total{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid color-mix(in srgb,var(--hint) 25%,transparent);display:flex;align-items:baseline;justify-content:space-between}
#total .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
#expr{color:var(--hint);font-size:14px;margin:-6px 0 12px;word-break:break-word}
details summary{cursor:pointer;color:var(--hint);padding:4px 0}
.tabs{display:flex;gap:6px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;background:transparent;color:var(--hint);font-weight:500}
.tabs button.on{background:var(--bg);color:var(--fg);font-weight:600}
</style>
</head>
<body>
<h1>Калькулятор калорий</h1>

<div class="tabs">
  <button id="t-calc" class="on">Калькулятор</button>
  <button id="t-hist">Сохранённое</button>
</div>

<div id="tab-calc">
<div class="card">
  <input id="q" placeholder="Продукт: сосиска, пюре, яблоко…" autocomplete="off">
  <div id="sug"></div>
  <div class="row">
    <input id="amt" type="number" inputmode="decimal" placeholder="Количество" min="0">
    <select id="unit" class="narrow"></select>
  </div>
  <div class="row"><button id="add">Добавить в блюдо</button></div>
</div>

<div class="card" id="list"></div>
<div id="expr"></div>
<button class="ghost" id="clear">Очистить блюдо</button>

<div class="card">
  <div class="row"><input id="hname" placeholder="Название блюда (не обязательно)"></div>
  <div class="row"><button id="save">Сохранить блюдо</button></div>
</div>

<details class="card">
  <summary>Свой продукт</summary>
  <input id="cn" placeholder="Название" style="margin-top:8px">
  <div class="row">
    <input id="ck" type="number" inputmode="decimal" placeholder="ккал на 100 г">
    <input id="cp" type="number" inputmode="decimal" placeholder="вес 1 шт, г (не обяз.)">
  </div>
  <div class="row"><button id="cadd">Сохранить продукт</button></div>
</details>
</div>

<div id="tab-hist" hidden>
  <div class="card" id="histcard">
    <div id="today" style="font-weight:600;margin-bottom:4px"></div>
    <div id="hist"></div>
  </div>
</div>

<div id="total"><span>Итого</span><span><span class="big" id="sum">0</span> ккал</span></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// [название, ккал на 100 г, вес 1 шт в граммах (0 — только граммы)]
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRz8pFRv5JPKzQPdL2J6BYQ1mYxIc41JI85VPcUE3f1W4c70vvtcyir9LaXp4UJIWxn_MJnjaUiyUwv/pub?gid=1632381490&single=true&output=csv"; // сюда вставьте ссылку на опубликованную таблицу (CSV)
let BASE = [
["Сосиска молочная",266,50],["Сардельки",270,100],["Колбаса вареная",260,0],["Сыр твердый",360,0],["Сыр плавленый",300,0],
["Картофельное пюре (на молоке с маслом)",106,0],["Картофель отварной",82,0],["Картофель жареный",190,0],["Макароны отварные",120,0],
["Рис отварной",116,0],["Гречка отварная",110,0],["Овсянка на воде",88,0],["Овсянка на молоке",102,0],["Хлеб белый",250,25],
["Хлеб черный",210,25],["Яйцо куриное",157,55],["Яичница",243,0],["Омлет",184,0],["Куриная грудка отварная",137,0],
["Куриное бедро запеченное",185,0],["Говядина отварная",254,0],["Свинина жареная",320,0],["Котлета домашняя",230,80],
["Фарш говяжий",250,0],["Рыба белая запеченная",110,0],["Лосось запеченный",208,0],["Творог 5%",121,0],["Творог 9%",169,0],
["Йогурт натуральный",66,0],["Молоко 2.5%",52,0],["Кефир 2.5%",53,0],["Сметана 20%",206,0],["Сливочное масло",748,0],
["Растительное масло",899,0],["Майонез",630,0],["Кетчуп",93,0],["Сахар",399,0],["Мед",329,0],["Помидор",20,100],
["Огурец",15,100],["Морковь",32,80],["Капуста белая",27,0],["Лук репчатый",41,80],["Яблоко",47,150],["Банан",96,120],
["Апельсин",43,150],["Шоколад молочный",535,0],["Печенье",430,10],["Пельмени вареные",275,15],["Блин",190,50],
["Пицца",270,0],["Сухарики",400,0],["Орехи грецкие",654,0],["Авокадо",160,150]
];

const store = {
  get(){try{return JSON.parse(localStorage.getItem("custom")||"[]")}catch(e){return []}},
  set(v){try{localStorage.setItem("custom",JSON.stringify(v))}catch(e){}}
};
let custom = store.get();
let dish = [];
let picked = null;

const $ = id => document.getElementById(id);
const all = () => custom.concat(BASE);
const fmt = n => Math.round(n);
const norm = s => s.toLowerCase().replace(/ё/g,"е");

function setUnits(){
  const u = $("unit");
  u.innerHTML = '<option value="g">г</option>' + (picked && picked[2] ? '<option value="pc">шт</option>' : "");
  if (picked && picked[2]) u.value = "pc";
}

function pick(p){
  picked = p; $("q").value = p[0]; $("sug").innerHTML = "";
  setUnits(); $("amt").focus();
}

function suggest(){
  const t = norm($("q").value.trim());
  picked = null; setUnits();
  const box = $("sug"); box.innerHTML = "";
  if (!t) return;
  all().filter(p => norm(p[0]).includes(t)).slice(0,6).forEach(p=>{
    const b = document.createElement("button");
    b.textContent = p[0] + " · " + p[1];
    b.onclick = () => pick(p);
    box.appendChild(b);
  });
  const exact = all().find(p => norm(p[0]) === t);
  if (exact) pick(exact);
}

function add(){
  const amount = parseFloat($("amt").value);
  if (!picked) { const f = all().find(p=>norm(p[0]).includes(norm($("q").value.trim())) && $("q").value.trim()); if (f) pick(f); }
  if (!picked || !(amount > 0)) { if (tg) tg.HapticFeedback.notificationOccurred("error"); return; }
  const pc = $("unit").value === "pc";
  const grams = pc ? amount * picked[2] : amount;
  dish.push({name:picked[0], label: pc ? amount+" шт" : amount+" г", kcal: grams*picked[1]/100});
  $("q").value = ""; $("amt").value = ""; picked = null; setUnits(); $("sug").innerHTML = "";
  render();
  if (tg) tg.HapticFeedback.impactOccurred("light");
}

function render(){
  const l = $("list");
  l.innerHTML = dish.length ? "" : '<div class="empty">Добавьте первый продукт</div>';
  dish.forEach((d,i)=>{
    const r = document.createElement("div"); r.className = "item";
    r.innerHTML = '<div class="n">'+d.name+'<div class="a">'+d.label+'</div></div><div class="k">'+fmt(d.kcal)+'</div>';
    const x = document.createElement("button"); x.className = "ghost"; x.textContent = "✕";
    x.onclick = () => { dish.splice(i,1); render(); };
    r.appendChild(x); l.appendChild(r);
  });
  const s = dish.reduce((a,d)=>a+d.kcal,0);
  $("sum").textContent = fmt(s);
  $("expr").textContent = dish.length ? dish.map(d=>d.name.toLowerCase()+" "+d.label).join(" + ") + " = " + fmt(s) + " ккал" : "";
}

function addCustom(){
  const n = $("cn").value.trim(), k = parseFloat($("ck").value), p = parseFloat($("cp").value)||0;
  if (!n || !(k >= 0)) return;
  custom.unshift([n,k,p]); store.set(custom);
  $("cn").value = $("ck").value = $("cp").value = "";
  if (tg) tg.HapticFeedback.notificationOccurred("success");
}

$("q").addEventListener("input", suggest);
$("add").onclick = add;
$("cadd").onclick = addCustom;
$("clear").onclick = () => { dish = []; render(); };

function parseCSV(t){
  const out=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','||c===';'){ row.push(cur); cur=""; }
    else if(c==='\n'){ row.push(cur); out.push(row); row=[]; cur=""; }
    else if(c!=='\r') cur+=c;
  }
  if(cur||row.length){ row.push(cur); out.push(row); }
  return out;
}
const num = v => parseFloat(String(v||"").replace(",","."));
function fromCSV(t){
  return parseCSV(t).map(r=>[(r[0]||"").trim(), num(r[1]), num(r[2])||0])
    .filter(r=>r[0] && r[1]>=0);
}
async function loadSheet(){
  if(!SHEET_URL) return;
  try{
    const r = await fetch(SHEET_URL, {cache:"no-store"});
    if(!r.ok) throw 0;
    const rows = fromCSV(await r.text());
    if(!rows.length) throw 0;
    BASE = rows;
    try{localStorage.setItem("sheet",JSON.stringify(rows))}catch(e){}
  }catch(e){
    try{ const c = JSON.parse(localStorage.getItem("sheet")||"null"); if(c&&c.length) BASE=c; }catch(_){}
  }
}
loadSheet();


const hs = {
  get(){try{return JSON.parse(localStorage.getItem("history")||"[]")}catch(e){return []}},
  set(v){try{localStorage.setItem("history",JSON.stringify(v))}catch(e){}}
};
let history = hs.get();
const dayKey = t => new Date(t).toDateString();
const when = t => new Date(t).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

function saveDish(){
  if(!dish.length){ if(tg) tg.HapticFeedback.notificationOccurred("error"); return; }
  const total = dish.reduce((a,d)=>a+d.kcal,0);
  history.unshift({id:Date.now(), t:Date.now(), name:$("hname").value.trim(), items:dish.slice(), total});
  history = history.slice(0,200); hs.set(history);
  $("hname").value = ""; dish = []; render(); renderHist();
  if(tg) tg.HapticFeedback.notificationOccurred("success");
}

function renderHist(){
  $("t-hist").textContent = history.length ? "Сохранённое ("+history.length+")" : "Сохранённое";
  const box = $("hist"); box.innerHTML = history.length ? "" : '<div class="empty">Пока ничего не сохранено</div>';
  const todaySum = history.filter(e=>dayKey(e.t)===dayKey(Date.now())).reduce((a,e)=>a+e.total,0);
  $("today").textContent = "Сегодня сохранено: " + fmt(todaySum) + " ккал";
  history.forEach(e=>{
    const d = document.createElement("details");
    d.className = "item"; d.style.display = "block";
    const s = document.createElement("summary");
    s.style.cssText = "display:flex;gap:8px;align-items:center;color:var(--fg)";
    s.innerHTML = '<span class="n">'+(e.name||"Блюдо")+'<div class="a">'+when(e.t)+'</div></span><span class="k">'+fmt(e.total)+' ккал</span>';
    d.appendChild(s);
    const body = document.createElement("div"); body.className = "a"; body.style.margin = "6px 0";
    body.textContent = e.items.map(i=>i.name.toLowerCase()+" "+i.label).join(" + ");
    d.appendChild(body);
    const r = document.createElement("div"); r.className = "row";
    const open = document.createElement("button"); open.textContent = "Открыть";
    open.onclick = () => { dish = e.items.slice(); render(); showTab("calc"); window.scrollTo(0,0); };
    const del = document.createElement("button"); del.className = "ghost"; del.textContent = "Удалить";
    del.onclick = () => { history = history.filter(x=>x.id!==e.id); hs.set(history); renderHist(); };
    r.appendChild(open); r.appendChild(del); d.appendChild(r);
    box.appendChild(d);
  });
}
function showTab(n){
  $("tab-calc").hidden = n !== "calc";
  $("tab-hist").hidden = n !== "hist";
  $("total").style.display = n === "calc" ? "flex" : "none";
  $("t-calc").className = n === "calc" ? "on" : "";
  $("t-hist").className = n === "hist" ? "on" : "";
}
$("t-calc").onclick = () => showTab("calc");
$("t-hist").onclick = () => showTab("hist");
$("save").onclick = saveDish;
renderHist();
setUnits(); render();
</script>
</body>
</html>
